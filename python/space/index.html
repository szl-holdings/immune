<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>IMMUNE — Python kernel</title>
  <style>
    :root {
      --bg:#07090c; --elev:#0e1218; --subtle:#141a22; --fg:#e8eef4;
      --muted:#8b96a5; --primary:#e8b86d; --ok:#7dcea0; --danger:#f07167; --line:rgba(232,238,244,.12);
    }
    * { box-sizing:border-box }
    html,body { margin:0; background:var(--bg); color:var(--fg);
      font:15px/1.45 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; min-height:100% }
    body { background: radial-gradient(80% 50% at 10% -10%, rgba(232,184,109,.09), transparent 46%), var(--bg) }
    header { display:flex; flex-wrap:wrap; gap:12px; align-items:center;
      padding:16px 20px; border-bottom:1px solid var(--line) }
    .mark { width:40px; height:40px; display:grid; place-items:center; border:1px solid var(--primary);
      color:var(--primary); border-radius:8px; font:700 13px ui-monospace,monospace }
    h1 { margin:0; font-size:18px; letter-spacing:.16em }
    .kicker { font:10px ui-monospace,monospace; letter-spacing:.2em; text-transform:uppercase; color:var(--muted) }
    .pill { font:11px ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase;
      border:1px solid var(--ok); color:var(--ok); padding:6px 10px; border-radius:999px }
    .pill.bad { border-color:var(--danger); color:var(--danger) }
    main { max-width:1180px; margin:0 auto; padding:20px; display:grid; gap:14px }
    @media (min-width:900px) { .cols { grid-template-columns:1.1fr .9fr } }
    .grid { display:grid; gap:14px }
    .panel { background:rgba(14,18,24,.9); border:1px solid var(--line); border-radius:16px; padding:16px 18px }
    h2 { margin:0 0 8px; font-size:14px; letter-spacing:.12em; text-transform:uppercase }
    .muted { color:var(--muted); font-size:13px }
    .mono { font-family:ui-monospace, Menlo, monospace }
    .tiny { font:10px ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--muted) }
    .card { background:var(--subtle); border:1px solid var(--line); border-radius:10px; padding:12px }
    .row { display:flex; justify-content:space-between; gap:8px; align-items:center }
    .list { display:grid; gap:8px }
    button, .act { font:12px ui-sans-serif; background:var(--primary); color:#1a1408; border:0;
      border-radius:8px; padding:10px 14px; min-height:44px; cursor:pointer; font-weight:600 }
    button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line) }
    input, textarea { width:100%; background:var(--subtle); color:var(--fg); border:1px solid var(--line);
      border-radius:8px; padding:10px; font:inherit }
    a { color:var(--primary) }
    footer { padding:12px 20px; border-top:1px solid var(--line); font:10px ui-monospace,monospace;
      letter-spacing:.14em; text-transform:uppercase; color:var(--muted) }
    .ok { color:var(--ok) } .bad { color:var(--danger) }
  </style>
</head>
<body>
  <header>
    <div class="mark">Λ</div>
    <div>
      <h1>IMMUNE</h1>
      <p class="kicker">Python kernel · live operator · YAWAR · SENTRA</p>
    </div>
    <span id="pill" class="pill">BOOTING</span>
  </header>
  <main>
    <section class="panel">
      <div class="row">
        <h2>Authority</h2>
        <span class="tiny" id="kid">kid —</span>
      </div>
      <p class="muted" id="reason">loading this process…</p>
      <p class="mono tiny" id="hash"></p>
    </section>
    <div class="grid cols">
      <section class="panel">
        <h2>Cycle</h2>
        <p class="muted">SENTRA inspect → YAWAR seal → HUKLLA. Defense only.</p>
        <textarea id="intent" rows="3">observe inbound radar, isolate, deceive</textarea>
        <div class="row" style="margin-top:10px">
          <button id="cycle">Seal cycle</button>
          <button class="ghost" id="reset">Reset PASS</button>
        </div>
        <div id="cycleOut" class="list" style="margin-top:12px"></div>
      </section>
      <section class="panel">
        <h2>Second brain</h2>
        <p class="muted" id="brainMeta">575 SOFTWARE handles</p>
        <div class="row">
          <input id="q" value="yawar receipts" />
          <button id="retrieve">Retrieve</button>
        </div>
        <div id="hits" class="list" style="margin-top:12px"></div>
      </section>
    </div>
    <section class="panel">
      <h2>Organs</h2>
      <div id="organs" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"></div>
    </section>
    <section class="panel">
      <h2>MESH</h2>
      <p class="muted" id="meshMeta">3-of-4</p>
      <div id="votes" class="list"></div>
    </section>
  </main>
  <footer>live operator · write-ready · Λ = conjecture 1 · doctrine v11 · not demo</footer>
<script>
const $ = (id) => document.getElementById(id);
function pill(ok, text) {
  $("pill").textContent = text;
  $("pill").className = "pill" + (ok ? "" : " bad");
}
async function j(path, opt) {
  const r = await fetch(path, opt);
  return r.json();
}
function card(html) { return `<div class="card">${html}</div>`; }

async function refresh() {
  const dash = await j("/api/immune/dashboard");
  const ready = dash.readiness || {};
  const auth = dash.authority || {};
  pill(ready.write_ready, ready.write_ready ? "WRITE-READY LIVE" : (ready.status || "NOT READY"));
  $("reason").textContent = `${auth.evidenceState || "—"} · ${auth.reason || ""} · receipts ${dash.ledger?.count ?? 0}`;
  $("kid").textContent = "kid " + (auth.authority?.keyId || "—");
  $("hash").textContent = (dash.ledger?.lastHash || "").slice(0, 48);
  const organs = dash.organs?.organs || [];
  $("organs").innerHTML = organs.map(o => card(`<div class="row"><strong>${o.title}</strong><span class="tiny ok">${o.provenance}</span></div><p class="muted">${o.detail}</p>`)).join("");
  const mesh = dash.mesh || {};
  $("meshMeta").textContent = `${mesh.liveCount || 0}-of-${mesh.of || 4} · ${mesh.reached ? "QUORUM" : "OPEN"}`;
  $("votes").innerHTML = (mesh.votes || []).map(v => card(`<div class="row"><strong>${v.title}</strong><span class="${v.live?"ok":"bad"}">${v.stage}</span></div>`)).join("");
  const brain = dash.brain || {};
  $("brainMeta").textContent = `${brain.chunks || 575} handles · loss ${brain.trained?.finalLoss ?? "—"} · acc ${brain.trained?.accuracy ?? "—"}`;
}

async function cycle() {
  const body = await j("/api/immune/cycle", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ actor: "immune:live-operator", intent: $("intent").value })
  });
  $("cycleOut").innerHTML = card(`<div class="row"><span class="${body.pass?"ok":"bad"}">${body.pass?"SEALED":"REFUSED"}</span><span class="tiny">${body.sentra?.signatureMatched || ""}</span></div><p class="muted">${body.sentra?.reason || ""}</p><p class="mono tiny">${(body.receipt?.hash || "").slice(0,40)}</p>`);
  await refresh();
}
async function retrieve() {
  const body = await j("/api/immune/brain", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ q: $("q").value, k: 6 })
  });
  $("hits").innerHTML = (body.hits || []).map(h => card(`<div class="row"><strong>${h.handle}</strong><span class="tiny">${h.score}</span></div><p class="muted">${h.excerpt}</p>`)).join("");
}
$("cycle").onclick = cycle;
$("retrieve").onclick = retrieve;
$("reset").onclick = async () => { await j("/api/immune/reset", { method:"POST", headers:{"Content-Type":"application/json"}, body:"{}" }); await refresh(); };
refresh().then(retrieve);
</script>
</body>
</html>
