name: hf-space-private-inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-space-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir "huggingface_hub==1.23.0"
      - name: Inventory authenticated Hugging Face Spaces
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN absent"; exit 2; }
          echo "::add-mask::$HF_TOKEN"
          python - <<'PY'
          import json, os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          identity = api.whoami(token=os.environ["HF_TOKEN"])
          spaces = []
          for item in api.list_spaces(author="SZLHOLDINGS", full=True):
              spaces.append({
                  "id": item.id,
                  "sha": str(item.sha or ""),
                  "private": bool(item.private),
                  "sdk": getattr(item, "sdk", None),
                  "last_modified": str(getattr(item, "last_modified", "") or ""),
              })
          print("HF_IDENTITY " + json.dumps({"name": identity.get("name"), "type": identity.get("type")}, sort_keys=True))
          print("HF_SPACE_INVENTORY " + json.dumps(sorted(spaces, key=lambda x: x["id"].lower()), sort_keys=True))
          print("HF_SPACE_COUNT " + str(len(spaces)))
          PY
