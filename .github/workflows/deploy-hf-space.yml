name: Deploy to HF Space

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-hf-space
  cancel-in-progress: false

env:
  HF_SPACE: SZLHOLDINGS/immune

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install pinned Hugging Face publisher
        run: python3 -m pip install --quiet "huggingface_hub==1.26.0"
      - name: Require write-scoped HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || {
            echo "::error::HF_TOKEN is not set; refusing to claim a deployment."
            exit 1
          }
          python3 - <<'PYEOF'
          import os
          from huggingface_hub import HfApi
          who = HfApi(token=os.environ["HF_TOKEN"]).whoami()
          role = ((who.get("auth") or {}).get("accessToken") or {}).get("role")
          if role == "read":
              raise SystemExit("HF_TOKEN is read-only")
          print("Authenticated Hugging Face publisher:", who.get("name", "<unknown>"))
          PYEOF
      - name: Install, typecheck, and build exact source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run typecheck
          SOURCE_REVISION="${GITHUB_SHA}" pnpm run build
          SOURCE_REVISION="${GITHUB_SHA}" node tests/smoke-standalone.mjs
      - name: Publish fresh runtime whitelist and verify live source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import glob
          import json
          import os
          import time
          import urllib.request
          from huggingface_hub import (
              HfApi,
              CommitOperationAdd,
              CommitOperationDelete,
              hf_hub_download,
          )
          from scripts.restart_hf_space import restart_if_paused

          token = os.environ["HF_TOKEN"]
          space = os.environ["HF_SPACE"]
          api = HfApi(token=token)
          uploads = {
              "Dockerfile": "frontend/deploy/Dockerfile",
              ".dockerignore": "frontend/deploy/.dockerignore",
              "README.md": "frontend/deploy/README.md",
              "hf-deploy-manifest.json": "frontend/deploy/dist/hf-deploy-manifest.json",
          }
          for local in glob.glob("frontend/deploy/dist/**/*", recursive=True):
              if os.path.isfile(local):
                  relative = os.path.relpath(local, "frontend/deploy").replace("\\", "/")
                  uploads[relative] = local

          existing = set(api.list_repo_files(space, repo_type="space"))
          keep = set(uploads)
          operations = []
          for remote, local in sorted(uploads.items()):
              operations.append(CommitOperationAdd(path_in_repo=remote, path_or_fileobj=local))
          for remote in sorted(existing - keep):
              if not remote.startswith(".github/"):
                  operations.append(CommitOperationDelete(path_in_repo=remote))

          commit = api.create_commit(
              repo_id=space,
              repo_type="space",
              operations=operations,
              commit_message=f"deploy: source-bound IMMUNE {os.environ['GITHUB_SHA'][:12]}",
          )
          target = commit.oid
          print("Published Space revision:", target)
          api.add_space_variable(
              repo_id=space,
              key="IMMUNE_EXPECTED_HF_REVISION",
              value=target,
          )
          restart_if_paused(space, target, token, api=api)

          deadline = time.monotonic() + 720
          while time.monotonic() < deadline:
              info = api.space_info(space)
              runtime = api.get_space_runtime(space)
              stage = getattr(runtime.stage, "value", str(runtime.stage))
              print("Observed:", info.sha, stage)
              if info.sha == target and stage == "RUNNING":
                  break
              if info.sha == target and stage in {"BUILD_ERROR", "RUNTIME_ERROR", "CONFIG_ERROR"}:
                  raise RuntimeError(f"Space reached {stage} at {target}")
              time.sleep(10)
          else:
              raise TimeoutError(f"Space did not reach RUNNING at {target}")

          import hashlib
          for remote, local in sorted(uploads.items()):
              downloaded = hf_hub_download(
                  repo_id=space,
                  repo_type="space",
                  filename=remote,
                  revision=target,
                  token=token,
              )
              with open(local, "rb") as local_file:
                  local_digest = hashlib.sha256(local_file.read()).hexdigest()
              with open(downloaded, "rb") as remote_file:
                  remote_digest = hashlib.sha256(remote_file.read()).hexdigest()
              if local_digest != remote_digest:
                  raise RuntimeError(
                      f"Published artifact digest mismatch for {remote}"
                  )

          base = "https://szlholdings-immune.hf.space"
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(base + "/healthz", timeout=15) as response:
                      health = json.load(response)
                  with urllib.request.urlopen(base + "/readyz", timeout=15) as response:
                      assert response.status == 200
                      readiness = json.load(response)
                  with urllib.request.urlopen(base + "/api/immune/ledger/verify", timeout=15) as response:
                      ledger = json.load(response)
                  with urllib.request.urlopen(base + "/.well-known/szl-source.json", timeout=15) as response:
                      source = json.load(response)
                  assert health["transport_state"] == "REACHABLE"
                  assert readiness["schema"] == "szl.immune-readiness/v1"
                  assert readiness["status"] == "READ_ONLY"
                  assert readiness["ready"] is False
                  assert readiness["source"]["revision"] == os.environ["GITHUB_SHA"].lower()
                  assert readiness["source"]["build_revision"] == os.environ["GITHUB_SHA"].lower()
                  assert readiness["runtime_ready"] is True
                  assert readiness["read_ready"] is True
                  assert readiness["authority_ready"] is False
                  assert readiness["write_ready"] is False
                  assert readiness["blockers"] == ["ACTION_TRUST_ROOT_UNCONFIGURED"]
                  assert readiness["runtime"]["artifact_integrity"]["status"] == "MATCH"
                  assert readiness["ledger"]["ok"] is True
                  assert ledger["ok"] is True
                  assert source["deployment"]["hf_revision"] == target
                  assert source["source"]["commit"] == os.environ["GITHUB_SHA"].lower()
                  assert source["artifact_integrity"]["status"] == "MATCH"
                  assert source["claims"]["runtime_whitelist_hash_match"] is True
                  assert source["claims"]["github_actions_provenance_verified"] is False
                  assert source["claims"]["cryptographic_release_receipt"] is False
                  assert source["alignment_state"] in {
                      "REVISION_UNAVAILABLE",
                      "OBSERVED_RUNTIME_HASH_MATCH",
                  }
                  with urllib.request.urlopen(base + "/api/build-info", timeout=15) as response:
                      build = json.load(response)
                  assert build["build"]["state"] == "OBSERVED_HASH_MATCH"
                  assert build["build"]["receipt_minted"] is False
                  print(
                      "LIVE READBACK VERIFIED; CRYPTOGRAPHIC RECEIPT UNAVAILABLE:",
                      target,
                      os.environ["GITHUB_SHA"],
                  )
                  break
              except Exception as error:
                  if attempt == 17:
                      raise RuntimeError("Public IMMUNE verification failed") from error
                  time.sleep(5)
          PYEOF
