name: Deploy IMMUNE Spaces

# Channel A = SZLHOLDINGS/immune (TypeScript HUD + kernel)
# Channel B = SZLHOLDINGS/immune-lattice (Python kernel COP)
# Do not delete either Space. First-class product tab remains a-11-oy.com/immune.
on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - server/**
      - python/**
      - scripts/assert_hf_space_operational.py
      - scripts/immune_publication_guard.py
      - tests/test_immune_publication_guard.py
      - .github/workflows/deploy-hf-space.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-immune-spaces
  cancel-in-progress: false

jobs:
  channel-a:
    name: Publish SZLHOLDINGS/immune
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_SPACE: SZLHOLDINGS/immune
    steps:
      - name: Require canonical main before credential use
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = szl-holdings/immune
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned Hugging Face publisher
        run: python3 -m pip install --quiet "huggingface_hub==1.23.0"
      - name: Validate publication boundary offline
        run: python3 -m unittest discover -s tests -p 'test_immune_publication*.py' -v
      - name: Require write-scoped HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN is not set"; exit 1; }
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          who = HfApi(endpoint="https://huggingface.co", token=os.environ["HF_TOKEN"]).whoami()
          role = ((who.get("auth") or {}).get("accessToken") or {}).get("role")
          if role == "read":
              raise SystemExit("HF_TOKEN is read-only")
          print("Authenticated Hugging Face publisher:", who.get("name", "<unknown>"))
          PY
      - name: Install, typecheck, and build exact source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run typecheck
          SOURCE_REVISION="${GITHUB_SHA}" pnpm run build
      - name: Publish existing Channel A with bounded ownership and parent guard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import glob
          import os
          from pathlib import Path
          from scripts.immune_publication_guard import publish_existing
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          space = os.environ["HF_SPACE"]
          api = HfApi(endpoint="https://huggingface.co", token=token)
          uploads = {
              "Dockerfile": "frontend/deploy/Dockerfile",
              ".dockerignore": "frontend/deploy/.dockerignore",
              "README.md": "frontend/deploy/README.md",
          }
          manifest = "frontend/deploy/dist/hf-deploy-manifest.json"
          if os.path.isfile(manifest):
              uploads["hf-deploy-manifest.json"] = manifest
          for local in glob.glob("frontend/deploy/dist/**/*", recursive=True):
              if os.path.isfile(local):
                  relative = os.path.relpath(local, "frontend/deploy").replace("\\", "/")
                  uploads[relative] = local
          result = publish_existing(
              api, space, uploads, os.environ["GITHUB_SHA"],
              checkout=Path.cwd(),
              receipt_path=Path("reports/publication-boundary/channel-a.json"),
          )
          print("Channel A source committed; live deployment UNVERIFIED:", result["hub_commit"])
          PY
      - name: Retain Channel A publication boundary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: immune-publication-boundary-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/publication-boundary/channel-a.json
          if-no-files-found: error
          retention-days: 90

  channel-b:
    name: Publish SZLHOLDINGS/immune-lattice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_SPACE: SZLHOLDINGS/immune-lattice
    steps:
      - name: Require canonical main before credential use
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = szl-holdings/immune
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned Hugging Face publisher
        run: python3 -m pip install --quiet "huggingface_hub==1.23.0"
      - name: Validate publication boundary offline
        run: python3 -m unittest discover -s tests -p 'test_immune_publication*.py' -v
      - name: Require write-scoped HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN is not set"; exit 1; }
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          who = HfApi(endpoint="https://huggingface.co", token=os.environ["HF_TOKEN"]).whoami()
          role = ((who.get("auth") or {}).get("accessToken") or {}).get("role")
          if role == "read":
              raise SystemExit("HF_TOKEN is read-only")
          print("Authenticated Hugging Face publisher:", who.get("name", "<unknown>"))
          PY
      - name: Publish existing Channel B with bounded ownership and parent guard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from huggingface_hub import HfApi
          from pathlib import Path
          from scripts.immune_publication_guard import publish_existing

          token = os.environ["HF_TOKEN"]
          space = os.environ["HF_SPACE"]
          api = HfApi(endpoint="https://huggingface.co", token=token)

          uploads = {
              "Dockerfile": "python/space/Dockerfile",
              "requirements.txt": "python/requirements.txt",
              "README.md": "python/space/README.md",
              "server.py": "python/space/run.py",
              "index.html": "python/space/index.html",
          }
          if Path("python/space/nexus.html").is_file():
              uploads["nexus.html"] = "python/space/nexus.html"
          root = Path("python/immune")
          for path in root.rglob("*"):
              if path.is_file() and path.suffix != ".pyc" and "__pycache__" not in path.parts:
                  uploads["immune/" + str(path.relative_to(root)).replace("\\", "/")] = str(path)

          result = publish_existing(
              api, space, uploads, os.environ["GITHUB_SHA"],
              checkout=Path.cwd(),
              receipt_path=Path("reports/publication-boundary/channel-b.json"),
          )
          print("Channel B source committed; live deployment UNVERIFIED:", result["hub_commit"])
          PY
      - name: Retain Channel B publication boundary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: immune-publication-boundary-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/publication-boundary/channel-b.json
          if-no-files-found: error
          retention-days: 90
