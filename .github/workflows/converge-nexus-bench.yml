# SPDX-License-Identifier: Apache-2.0
name: Converge NEXUS and Bench

# Completed one-shot (2026-09). Dispatch only: a push must never re-run it.
# Its push paths included the IMMUNE card (frontend/deploy/README.md), so a
# card edit fired a deletion.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Run only after a separately authorized v2 operator activation
        required: true
        type: string

permissions:
  contents: read

# Per-asset write lock (plan D3); a deletion is never cancelled midway.
concurrency:
  group: hf-write/space/betterwithage/nexus-probe
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HOME: /tmp/hf-home
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Require separate convergence authorization
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "CONVERGE NEXUS AFTER V2 ACTIVATION"
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity and credential presence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN absent"; exit 2; }
          echo "::add-mask::$HF_TOKEN"

      - name: Require existing external-v2 authority before provider changes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'https://szlholdings-immune.hf.space';
          const read = async (path) => {
            const response = await fetch(base + path, {redirect: 'error', signal: AbortSignal.timeout(20000)});
            assert.equal(response.status, 200, 'External v2 activation is required before convergence');
            return response.json();
          };
          const ready = await read('/readyz');
          const state = await read('/api/immune/state');
          assert.equal(ready.status, 'READY');
          for (const key of ['ready', 'write_ready', 'runtime_ready', 'authority_ready']) assert.equal(ready[key], true);
          assert.deepEqual(ready.blockers, []);
          assert.equal(ready.source.revision, process.env.GITHUB_SHA);
          assert.equal(ready.source.alignment_state, 'OBSERVED_RUNTIME_HASH_MATCH');
          assert.equal(state.authority.version, 'immune.action.v2');
          assert.equal(state.authority.externalOperator, true);
          assert.equal(state.authority.source.revision, process.env.GITHUB_SHA);
          assert.equal(state.evidenceState, 'VERIFIED');
          assert.equal(state.mode, 'PASS');
          assert.equal(state.deadman, false);
          assert.ok(Date.parse(state.validUntil) > Date.now());
          assert.equal(ready.authority.version, 'immune.action.v2');
          assert.equal(ready.authority.key_id, state.authority.keyId);
          assert.equal(ready.authority.receipt_hash, state.authorityReceiptHash);
          assert.deepEqual(ready.authority.deployment, state.authority.deployment);
          assert.equal(ready.authority.durability.verified, true);
          console.log('Current external-v2 activation observed; existing convergence checks remain required.');
          NODE

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact Hub client
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.30.0"

      - name: Compile bounded operators
        run: >-
          python -m py_compile
          scripts/delete_nexus_probe.py
          scripts/verify_nexus_bench_preflight.py
          scripts/verify_nexus_bench_preflight_v3.py
          scripts/verify_nexus_bench_postdelete.py

      - name: Verify archive, structured Bench sources, static host, and current IMMUNE
        run: python scripts/verify_nexus_bench_preflight_v3.py

      - name: Delete only the exact archived Nexus Probe
        run: python scripts/delete_nexus_probe.py

      - name: Re-prove retained NEXUS, Bench, and IMMUNE
        run: python scripts/verify_nexus_bench_postdelete.py

      - name: Upload secret-free convergence receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-bench-convergence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 90
