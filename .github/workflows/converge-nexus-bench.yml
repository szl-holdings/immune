# SPDX-License-Identifier: Apache-2.0
name: Converge NEXUS and Bench

on:
  push:
    branches: [main]
    paths:
      - frontend/deploy/README.md
      - scripts/delete_nexus_probe.py
      - scripts/verify_nexus_bench_preflight.py
      - scripts/verify_nexus_bench_preflight_v3.py
      - scripts/verify_nexus_bench_postdelete.py
      - .github/workflows/converge-nexus-bench.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: converge-nexus-bench
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HOME: /tmp/hf-home
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity and credential presence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN absent"; exit 2; }
          echo "::add-mask::$HF_TOKEN"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact Hub client
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.30.0"

      - name: Compile bounded operators
        run: >-
          python -m py_compile
          scripts/delete_nexus_probe.py
          scripts/verify_nexus_bench_preflight.py
          scripts/verify_nexus_bench_preflight_v3.py
          scripts/verify_nexus_bench_postdelete.py

      - name: Verify archive, structured Bench sources, static host, and current IMMUNE
        run: python scripts/verify_nexus_bench_preflight_v3.py

      - name: Delete only the exact archived Nexus Probe
        run: python scripts/delete_nexus_probe.py

      - name: Re-prove retained NEXUS, Bench, and IMMUNE
        run: python scripts/verify_nexus_bench_postdelete.py

      - name: Upload secret-free convergence receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-bench-convergence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 90
