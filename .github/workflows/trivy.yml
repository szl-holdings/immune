name: Trivy

# Org reusable Trivy filesystem scan gate (SHA-pinned caller). Wave G CI parity.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  trivy:
    permissions:
      contents: read
      security-events: write
    uses: szl-holdings/.github/.github/workflows/reusable-trivy.yml@7659aaf3148189935893a7503d9b2536d1c5fb00
    secrets: inherit
