# SPDX-License-Identifier: Apache-2.0
name: Responsive UI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build the exact frontend for an authority-unavailable preview
        env:
          PORT: '7873'
          BASE_PATH: /
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir frontend run build
      - name: Install isolated browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/responsive-browser" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/responsive-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify phone, desktop and zoom layouts without action authority
        env:
          EXPECTED_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIEW_BASE_URL: http://127.0.0.1:7873
        run: |
          set -euo pipefail
          python3 -m http.server 7873 --bind 127.0.0.1 --directory frontend/dist/public > "$RUNNER_TEMP/immune-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/responsive-browser/node_modules/playwright/index.mjs" node scripts/check_responsive.mjs
      - name: Retain source-bound browser observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: immune-responsive-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/responsive-ui/
          if-no-files-found: error
          retention-days: 30
