name: hf-space-preserve-and-consolidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-space-preserve.yml
      - scripts/hf_space_preserve_and_consolidate.py

permissions:
  contents: read

concurrency:
  group: hf-space-preserve-and-consolidate
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /tmp/hf-home
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned Hub client
        run: python -m pip install --disable-pip-version-check --no-cache-dir "huggingface_hub==1.23.0"

      - name: Compile preservation engine
        run: python -m py_compile scripts/hf_space_preserve_and_consolidate.py

      - name: Fail closed if Hugging Face credential is absent
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN absent"; exit 2; }
          echo "::add-mask::$HF_TOKEN"

      - name: Preserve and consolidate without deleting org Spaces
        run: python scripts/hf_space_preserve_and_consolidate.py
