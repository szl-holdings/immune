name: hf-space-preserve-and-consolidate

# Publisher freeze confirmed by immune PR #98; retry the exact preservation gate.
# Completed one-shot (2026-09). Dispatch only: a push must never re-run it.
on:
  workflow_dispatch:

permissions:
  contents: read

# Multi-asset Hub job: canonical org write lock (plan D3).
concurrency:
  group: hf-write/org/SZLHOLDINGS
  cancel-in-progress: false

jobs:
  preflight:
    name: Protected-main admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify canonical dispatch source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_EVENT" = "workflow_dispatch"
          test "$EXPECTED_REPOSITORY" = "szl-holdings/immune"
          test "$EXPECTED_REF" = "refs/heads/main"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          live_main_sha="$(gh api "repos/$EXPECTED_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$live_main_sha" = "$EXPECTED_SHA"

  preserve:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /tmp/hf-home
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install pinned Hub client
        run: python -m pip install --disable-pip-version-check --no-cache-dir "huggingface_hub==1.23.0"

      - name: Enforce Hugging Face card metadata limits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/hf_space_preserve_and_consolidate.py")
          source = path.read_text(encoding="utf-8")
          old = "short_description: One public launcher and preserved source vault for SZL experiments"
          new = "short_description: Verified SZL experiment archive"
          if source.count(old) != 1:
              raise SystemExit(
                  "expected exactly one generated short_description to normalize"
              )
          path.write_text(source.replace(old, new), encoding="utf-8")
          print(f"normalized short_description length={len(new.split(': ', 1)[1])}")
          PY

      - name: Compile preservation engine
        run: python -m py_compile scripts/hf_space_preserve_and_consolidate.py

      - name: Fail closed if Hugging Face credential is absent
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN absent"; exit 2; }
          echo "::add-mask::$HF_TOKEN"

      - name: Preserve and consolidate without deleting org Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf_space_preserve_and_consolidate.py
