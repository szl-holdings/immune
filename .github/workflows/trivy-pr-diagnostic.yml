# SPDX-License-Identifier: Apache-2.0
name: Trivy PR security diagnostic

on:
  push:
    branches:
      - fix/remove-unused-re-20260904
    paths:
      - .github/workflows/trivy-pr-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout exact PR merge revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.0.0
        with:
          ref: refs/pull/100/merge
          fetch-depth: 1

      - name: Capture HIGH/CRITICAL finding metadata
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          format: json
          output: trivy-diagnostic.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Print redacted finding metadata only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("trivy-diagnostic.json").read_text(encoding="utf-8"))
          findings = []
          for result in report.get("Results") or []:
              target = result.get("Target")
              for item in result.get("Vulnerabilities") or []:
                  findings.append({
                      "kind": "vulnerability",
                      "target": target,
                      "id": item.get("VulnerabilityID"),
                      "package": item.get("PkgName"),
                      "installed": item.get("InstalledVersion"),
                      "fixed": item.get("FixedVersion"),
                      "severity": item.get("Severity"),
                  })
              for item in result.get("Secrets") or []:
                  findings.append({
                      "kind": "secret",
                      "target": target,
                      "rule_id": item.get("RuleID"),
                      "category": item.get("Category"),
                      "title": item.get("Title"),
                      "severity": item.get("Severity"),
                      "start_line": item.get("StartLine"),
                      "end_line": item.get("EndLine"),
                  })
              for item in result.get("Misconfigurations") or []:
                  cause = item.get("CauseMetadata") or {}
                  findings.append({
                      "kind": "misconfiguration",
                      "target": target,
                      "id": item.get("AVDID") or item.get("ID"),
                      "title": item.get("Title"),
                      "message": item.get("Message"),
                      "resolution": item.get("Resolution"),
                      "severity": item.get("Severity"),
                      "start_line": cause.get("StartLine"),
                      "end_line": cause.get("EndLine"),
                  })
          print(json.dumps({"count": len(findings), "findings": findings}, sort_keys=True))
          PY
