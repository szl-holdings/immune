name: Patch Nexus and Bench convergence once

on:
  push:
    branches:
      - fix/nexus-bench-idempotent-convergence-20260905
    paths:
      - .github/workflows/_patch_nexus_bench_convergence_once.yml

permissions:
  contents: write

concurrency:
  group: patch-nexus-bench-convergence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    name: Apply, verify, commit, and self-remove
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/nexus-bench-idempotent-convergence-20260905
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply bounded source repair
        run: python .github/scripts/_patch_nexus_bench_convergence_once.py

      - name: Install exact verification closure
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.30.0" "pytest==9.1.1" "ruff==0.16.6"

      - name: Prove convergence contracts offline
        env:
          HF_TOKEN: offline-test-token
        run: |
          set -euo pipefail
          python -m py_compile scripts/nexus_bench_stage1.py scripts/delete_nexus_probe.py
          ruff check scripts/nexus_bench_stage1.py scripts/delete_nexus_probe.py --select E9,F
          python -m pytest -q tests/test_nexus_bench_convergence.py
          git diff --check

      - name: Commit only permanent repair and self-remove
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            scripts/nexus_bench_stage1.py \
            tests/test_nexus_bench_convergence.py \
            .github/workflows/nexus-bench-convergence-contract.yml
          git rm -- \
            .github/scripts/_patch_nexus_bench_convergence_once.py \
            .github/workflows/_patch_nexus_bench_convergence_once.yml
          git commit -s -m 'fix(ops): make Nexus and Bench convergence idempotent'
          git push origin HEAD:fix/nexus-bench-idempotent-convergence-20260905
