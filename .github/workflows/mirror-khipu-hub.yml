# Immune holds the write-scoped HF_TOKEN. Sibling GitHub repos stay canonical.
# Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>
name: Mirror khipu Hub

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-khipu-hub.yml"

permissions:
  contents: read

concurrency:
  group: mirror-khipu-hub
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/szl-khipu
          path: khipu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/counsel
          path: counsel
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/ayllu
          path: ayllu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/szl-experiments
          path: experiments
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/szl-command-lab
          path: command-lab
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/khipu-lab
          path: khipu-lab
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/immune-lattice
          path: immune-lattice
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: immune-src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/szl-sovereign-os
          path: sovereign-os
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/szl-real-estate
          path: real-estate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/cosmos
          path: cosmos
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/a11oy-factory
          path: factory
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/nexus
          path: nexus
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install pinned Hugging Face publisher
        run: python3 -m pip install --quiet "huggingface_hub==1.26.0"
      - name: Require write-scoped HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || {
            echo "::error::HF_TOKEN is not set; refusing to claim a Hub mirror."
            exit 1
          }
          python3 - <<'PYEOF'
          import os
          from huggingface_hub import HfApi
          who = HfApi(token=os.environ["HF_TOKEN"]).whoami()
          role = ((who.get("auth") or {}).get("accessToken") or {}).get("role")
          if role == "read":
              raise SystemExit("HF_TOKEN is read-only")
          print("Authenticated Hugging Face publisher:", who.get("name", "<unknown>"))
          PYEOF
      - name: Publish khipu + sibling Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ORG: SZLHOLDINGS
        run: |
          set -euo pipefail
          python3 khipu/scripts/publish_hf.py
          python3 - <<'PY'
          import os
          import shutil
          import tempfile
          import textwrap
          from pathlib import Path
          from huggingface_hub import HfApi, create_repo

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          ignore = [".git*", "tests/*", ".venv/*", "__pycache__/*", ".github/*", ".grok/*"]
          failures = []

          HOLOGRAM_DOCKERFILE = textwrap.dedent("""\
          # Hugging Face Space — Python hologram. No npm ci. GCR pin.
          FROM mirror.gcr.io/library/python:3.12-slim
          WORKDIR /app
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PORT=7860
          COPY server.py ./server.py
          COPY index.html ./index.html
          EXPOSE 7860
          CMD ["python", "-u", "server.py"]
          """)

          IMMUNE_PYTHON_DOCKERFILE = textwrap.dedent("""\
          # IMMUNE Python kernel — Channel B. Live Ed25519 operator. GCR pin.
          FROM mirror.gcr.io/library/python:3.12-slim
          WORKDIR /app
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PORT=7860 IMMUNE_DATA_DIR=/app/data/immune
          COPY requirements.txt ./requirements.txt
          RUN pip install --no-cache-dir -r requirements.txt
          COPY immune ./immune
          COPY server.py ./server.py
          COPY index.html ./index.html
          EXPOSE 7860
          HEALTHCHECK --interval=30s --timeout=5s --start-period=20s --retries=5 \\
            CMD python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/readyz', timeout=4)"
          CMD ["python", "-u", "server.py"]
          """)

          KHIPU_DOCKERFILE = textwrap.dedent("""\
          # Hugging Face Space — numpy kernels, stdlib HTTP. No Gradio. GCR pin.
          FROM mirror.gcr.io/library/python:3.12-slim
          WORKDIR /app
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PORT=7860
          RUN pip install --no-cache-dir "numpy>=1.26"
          COPY server.py ./server.py
          COPY index.html ./index.html
          COPY szl_khipu ./szl_khipu
          EXPOSE 7860
          CMD ["python", "-u", "server.py"]
          """)

          NPM_DELETE = [
              "package.json",
              "package-lock.json",
              "pnpm-lock.yaml",
              "src/**",
              "scripts/**",
              "server/**",
              "migrations/**",
              "vite.config.ts",
              "tsconfig.json",
              "space-dist/**",
              "space/**",
              "startup.sh",
              "eslint.config.mjs",
              "public/**",
              ".grok/**",
              "node_modules/**",
          ]

          def sanitize(folder: str) -> None:
              p = Path(folder) / "README.md"
              if not p.exists():
                  return
              raw = p.read_text(encoding="utf-8")
              if not raw.startswith("---"):
                  return
              parts = raw.split("---", 2)
              if len(parts) < 3:
                  return
              fm, body = parts[1], parts[2]
              lines = []
              has_emoji = False
              for line in fm.splitlines():
                  if line.startswith("emoji:"):
                      has_emoji = True
                      val = line.split(":", 1)[1].strip().strip('"').strip("'")
                      # Hub rejects most emoji including 🛡️ (VS16) and anything
                      # outside a small card allow-list. ⚖️ is BMP (U+2696) so
                      # an Extended-Pictographic floor would *replace* a working
                      # card with 🛡️ and fail metadata.
                      allowed = {"⚖️", "💠", "🪢", "🎛️", "🧠", "⎈", "🚀", "🪐"}
                      if val not in allowed:
                          val = "🧠"
                      lines.append(f"emoji: {val}")
                  elif line.startswith("short_description:"):
                      val = line.split(":", 1)[1].strip().strip('"').strip("'")
                      if len(val) > 60:
                          val = val[:57].rstrip(" .,;") + "..."
                      lines.append(f'short_description: "{val}"')
                  elif line.startswith("sdk:"):
                      lines.append("sdk: docker")
                  elif line.startswith("sdk_version:") or line.startswith("app_file:"):
                      continue
                  elif line.startswith("python_version:"):
                      continue
                  else:
                      lines.append(line)
              if not has_emoji:
                  lines.insert(1, "emoji: 🧠")
              if not any(x.startswith("app_port:") for x in lines):
                  lines.append("app_port: 7860")
              p.write_text("---" + "\n".join(lines) + "\n---" + body, encoding="utf-8")

          def pub(local, repo_id, sdk, private=False):
              try:
                  sanitize(local)
                  create_repo(
                      repo_id,
                      repo_type="space",
                      space_sdk=sdk,
                      exist_ok=True,
                      private=private,
                      token=token,
                  )
                  try:
                      api.update_repo_settings(repo_id=repo_id, repo_type="space", private=False)
                  except Exception as exc:
                      print("visibility note", repo_id, type(exc).__name__, exc)
                  api.upload_folder(
                      folder_path=local,
                      repo_id=repo_id,
                      repo_type="space",
                      ignore_patterns=ignore,
                      delete_patterns=NPM_DELETE,
                  )
                  print("published", repo_id)
              except Exception as exc:
                  print("FAILED", repo_id, type(exc).__name__, exc)
                  failures.append(repo_id)

          def pub_hologram(local, repo_id, pkg=False, extra_delete=None, kernel_pkg=None, requirements=None):
              td = None
              try:
                  root = Path(local)
                  space = root / "space"
                  server = space / "server.py" if (space / "server.py").is_file() else root / "server.py"
                  index = space / "index.html" if (space / "index.html").is_file() else root / "index.html"
                  if not server.is_file() or not index.is_file():
                      print("SKIP", repo_id, "hologram payload missing (space/server.py + space/index.html)")
                      return
                  readme_src = space / "README.md" if (space / "README.md").is_file() else root / "README.md"
                  td = Path(tempfile.mkdtemp(prefix="hf-holo-"))
                  (td / "server.py").write_bytes(server.read_bytes())
                  (td / "index.html").write_bytes(index.read_bytes())
                  extras = []
                  src_dir = space if space.is_dir() else root
                  for extra in sorted(src_dir.glob("*.py")):
                      if extra.name == "server.py":
                          continue
                      (td / extra.name).write_bytes(extra.read_bytes())
                      extras.append(extra.name)
                  if readme_src.is_file():
                      (td / "README.md").write_text(readme_src.read_text(encoding="utf-8"), encoding="utf-8")
                      sanitize(str(td))
                  pkg_copied = False
                  if pkg:
                      src_pkg = root / "szl_khipu"
                      if src_pkg.is_dir():
                          shutil.copytree(
                              src_pkg,
                              td / "szl_khipu",
                              ignore=shutil.ignore_patterns("__pycache__", "*.pyc", ".pytest_cache"),
                          )
                          pkg_copied = True
                  immune_kernel = False
                  kp = Path(kernel_pkg) if kernel_pkg else None
                  if kp and kp.is_dir() and (kp / "runtime.py").is_file():
                      shutil.copytree(
                          kp,
                          td / "immune",
                          ignore=shutil.ignore_patterns("__pycache__", "*.pyc", ".pytest_cache"),
                      )
                      immune_kernel = True
                  req = Path(requirements) if requirements else (root / "requirements.txt")
                  if not req.is_file():
                      req = Path("immune-src/python/requirements.txt")
                  if req.is_file():
                      (td / "requirements.txt").write_bytes(req.read_bytes())
                  if pkg_copied:
                      dockerfile = KHIPU_DOCKERFILE
                  elif immune_kernel and (td / "requirements.txt").is_file():
                      dockerfile = IMMUNE_PYTHON_DOCKERFILE
                  else:
                      dockerfile = HOLOGRAM_DOCKERFILE
                      if extras:
                          dockerfile = dockerfile.rstrip() + "\n" + "\n".join(
                              f"COPY {name} ./{name}" for name in extras
                          ) + "\n"
                  (td / "Dockerfile").write_text(dockerfile, encoding="utf-8")
                  create_repo(
                      repo_id,
                      repo_type="space",
                      space_sdk="docker",
                      exist_ok=True,
                      private=False,
                      token=token,
                  )
                  try:
                      api.update_repo_settings(repo_id=repo_id, repo_type="space", private=False)
                  except Exception as exc:
                      print("visibility note", repo_id, type(exc).__name__, exc)
                  deletes = list(NPM_DELETE)
                  if extra_delete:
                      deletes.extend(extra_delete)
                  api.upload_folder(
                      folder_path=str(td),
                      repo_id=repo_id,
                      repo_type="space",
                      delete_patterns=deletes,
                  )
                  try:
                      api.restart_space(repo_id, factory_reboot=True)
                      print("factory_reboot", repo_id)
                  except Exception as exc:
                      print("reboot note", repo_id, type(exc).__name__, exc)
                  print("published hologram", repo_id, "pkg" if pkg_copied else "thin")
              except Exception as exc:
                  print("FAILED", repo_id, type(exc).__name__, exc)
                  failures.append(repo_id)
              finally:
                  if td is not None:
                      shutil.rmtree(td, ignore_errors=True)

          def pub_payload(local, repo_id, files, extra_delete=None):
              td = None
              try:
                  root = Path(local)
                  td = Path(tempfile.mkdtemp(prefix="hf-payload-"))
                  for src_name, dest_name in files:
                      src = root / src_name
                      if not src.is_file():
                          raise FileNotFoundError(src)
                      (td / dest_name).write_bytes(src.read_bytes())
                  sanitize(str(td))
                  create_repo(repo_id, repo_type="space", space_sdk="docker", exist_ok=True, private=False, token=token)
                  try:
                      api.update_repo_settings(repo_id=repo_id, repo_type="space", private=False)
                  except Exception as exc:
                      print("visibility note", repo_id, type(exc).__name__, exc)
                  deletes = list(NPM_DELETE)
                  if extra_delete:
                      deletes.extend(extra_delete)
                  api.upload_folder(folder_path=str(td), repo_id=repo_id, repo_type="space", delete_patterns=deletes)
                  try:
                      api.restart_space(repo_id, factory_reboot=True)
                      print("factory_reboot", repo_id)
                  except Exception as exc:
                      print("reboot note", repo_id, type(exc).__name__, exc)
                  print("published payload", repo_id)
              except Exception as exc:
                  print("FAILED", repo_id, type(exc).__name__, exc)
                  failures.append(repo_id)
              finally:
                  if td is not None:
                      shutil.rmtree(td, ignore_errors=True)

          pub_payload(
              "counsel",
              "SZLHOLDINGS/counsel",
              [
                  ("Dockerfile", "Dockerfile"),
                  ("app.py", "app.py"),
                  ("allodial.py", "allodial.py"),
                  ("index.html", "index.html"),
                  ("README.md", "README.md"),
              ],
              extra_delete=["requirements.txt", "packages.txt", "gradio_cached_examples/**", "flagged/**"],
          )
          pub("ayllu", "SZLHOLDINGS/ayllu", "docker")
          pub("experiments", "SZLHOLDINGS/szl-experiments", "docker")
          pub_hologram("command-lab", "SZLHOLDINGS/szl-command-lab")
          pub_hologram("khipu-lab", "SZLHOLDINGS/khipu-lab")
          pub_hologram(
              "immune-lattice",
              "SZLHOLDINGS/immune-lattice",
              kernel_pkg="immune-src/python/immune",
              requirements="immune-src/python/requirements.txt",
          )
          pub("sovereign-os", "SZLHOLDINGS/szl-sovereign-os", "docker")
          pub("real-estate", "SZLHOLDINGS/szl-real-estate", "docker")
          pub("cosmos", "SZLHOLDINGS/cosmos", "docker")
          pub("factory", "SZLHOLDINGS/a11oy-factory", "docker")
          pub_hologram("nexus", "SZLHOLDINGS/nexus")
          if (Path("khipu") / "space" / "server.py").is_file():
              pub_hologram(
                  "khipu",
                  "SZLHOLDINGS/szl-khipu",
                  pkg=True,
                  extra_delete=["app.py", "requirements.txt"],
              )
          else:
              print("SKIP SZLHOLDINGS/szl-khipu hologram — space/server.py missing")
          if failures:
              raise SystemExit("Hub publish failed for: " + ", ".join(failures))
          PY
