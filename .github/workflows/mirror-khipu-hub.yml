# Immune holds the write-scoped HF_TOKEN. Sibling GitHub repos stay canonical.
# Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>
name: Mirror khipu Hub

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-khipu-hub.yml"

permissions:
  contents: read

concurrency:
  group: mirror-khipu-hub
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/szl-khipu
          path: khipu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/counsel
          path: counsel
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/ayllu
          path: ayllu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/szl-experiments
          path: experiments
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/szl-command-lab
          path: command-lab
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/szl-sovereign-os
          path: sovereign-os
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/szl-real-estate
          path: real-estate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/cosmos
          path: cosmos
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install pinned Hugging Face publisher
        run: python3 -m pip install --quiet "huggingface_hub==1.26.0"
      - name: Require write-scoped HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || {
            echo "::error::HF_TOKEN is not set; refusing to claim a Hub mirror."
            exit 1
          }
          python3 - <<'PYEOF'
          import os
          from huggingface_hub import HfApi
          who = HfApi(token=os.environ["HF_TOKEN"]).whoami()
          role = ((who.get("auth") or {}).get("accessToken") or {}).get("role")
          if role == "read":
              raise SystemExit("HF_TOKEN is read-only")
          print("Authenticated Hugging Face publisher:", who.get("name", "<unknown>"))
          PYEOF
      - name: Publish khipu + sibling Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ORG: SZLHOLDINGS
        run: |
          set -euo pipefail
          python3 khipu/scripts/publish_hf.py
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi, create_repo

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          ignore = [".git*", "tests/*", ".venv/*", "__pycache__/*", ".github/*"]

          def pub(local, repo_id, sdk, private=False):
              create_repo(
                  repo_id,
                  repo_type="space",
                  space_sdk=sdk,
                  exist_ok=True,
                  private=private,
                  token=token,
              )
              try:
                  api.update_repo_visibility(repo_id=repo_id, repo_type="space", private=False)
              except Exception as exc:
                  print("visibility note", repo_id, exc)
              api.upload_folder(
                  folder_path=local,
                  repo_id=repo_id,
                  repo_type="space",
                  ignore_patterns=ignore,
              )
              print("published", repo_id)

          pub("counsel", "SZLHOLDINGS/counsel", "gradio")
          pub("ayllu", "SZLHOLDINGS/ayllu", "docker")
          pub("experiments", "SZLHOLDINGS/szl-experiments", "docker")
          pub("command-lab", "SZLHOLDINGS/szl-command-lab", "docker")
          pub("sovereign-os", "SZLHOLDINGS/szl-sovereign-os", "docker")
          pub("real-estate", "SZLHOLDINGS/szl-real-estate", "docker")
          pub("cosmos", "SZLHOLDINGS/cosmos", "docker")
          PY
