name: Repair exact Ruff F401 in preservation controller

on:
  push:
    branches:
      - fix/remove-unused-re-20260904
    paths:
      - .github/workflows/fix-unused-re-20260904.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/remove-unused-re-20260904
          fetch-depth: 1

      - name: Remove only the proved unused import and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/hf_space_preserve_and_consolidate.py")
          text = path.read_text(encoding="utf-8")
          needle = "import re\n"
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f"expected exactly one {needle!r}; found {count}")
          path.write_text(text.replace(needle, "", 1), encoding="utf-8")
          PY
          git rm .github/workflows/fix-unused-re-20260904.yml
          python -m compileall -q scripts/hf_space_preserve_and_consolidate.py
          python -m pip install --disable-pip-version-check ruff==0.16.6
          ruff check scripts/hf_space_preserve_and_consolidate.py --select E9,F

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stephen P. Lutar Jr."
          git config user.email "stephenlutar2@gmail.com"
          git add scripts/hf_space_preserve_and_consolidate.py
          git commit -m "fix(ci): remove unused preservation import" -m "Clear the exact Ruff F401 raised on Python 3.11 and 3.12 without changing preservation behavior."
          git push origin HEAD:fix/remove-unused-re-20260904
