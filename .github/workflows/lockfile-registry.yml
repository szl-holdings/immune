name: Lockfile Registry Check

# Fails fast when a committed lockfile references an internal-only registry.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfiles:
