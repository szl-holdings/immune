name: hf-restore-david-and-rebalance-49

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-consolidate-one-shot.yml
      - scripts/hf_restore_david_and_rebalance.py
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-restore-david-and-rebalance-49
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /tmp/hf-home
    steps:
      - name: Checkout exact protected-main transaction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned Hub client
        run: python -m pip install --disable-pip-version-check --no-cache-dir "huggingface_hub==1.23.0"

      - name: Compile rebalance transaction
        run: python -m py_compile scripts/hf_restore_david_and_rebalance.py

      - name: Fail closed if Hugging Face credential is absent
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN absent"; exit 2; }
          echo "::add-mask::$HF_TOKEN"

      - name: Restore David flagship and reconcile public archive to 49
        run: python scripts/hf_restore_david_and_rebalance.py
