name: Store reviewed IMMUNE lockfile object
"on":
  push:
    branches: [audit/verified-lockfile-object-20260915]
    paths: [.github/workflows/verified-lockfile-object.yml]
permissions:
  contents: write
jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - name: Store exact reviewed bytes only; never update any ref or commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,urllib.request as u,pathlib
          # Package-manager derivation: szl-org-health run34956269519/attempt1.
          # The SHA-256 below binds the full generated file, not a hand-edited lock.
          class NoRedirect(u.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise ValueError('redirect refused')
          opener=u.build_opener(u.ProxyHandler({}),NoRedirect())
          base='https://api.github.com/repos/szl-holdings/immune/git/blobs'
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'SZL-reviewed-lock-object'}
          def call(url,data=None):
              with opener.open(u.Request(url,data=data,headers=headers,method='GET' if data is None else 'POST'),timeout=25) as r:
                  raw=r.read(1024*1024+1)
                  if len(raw)>1024*1024: raise ValueError('response bound')
                  return json.loads(raw)
          old=call(base+'/3ab0ad47a98c69724c4d4b26fb08c11936a93067')
          if old.get('encoding')!='base64':raise ValueError('unexpected encoding')
          raw=base64.b64decode(old['content'])
          if hashlib.sha256(raw).hexdigest()!='1c8d238fd1558f8f38c9a4a97d37ae1fb1d279b4f83e8ae1de7e2a0709417f29':raise ValueError('base bytes differ')
          text=raw.decode('utf-8')
          pairs=[('26.4.0','26.4.1'),('19.2.5','19.2.7'),('13.1.1','13.2.0'),('1.35.0','1.41.0'),('4.4.3','4.5.4'),('debug@4.5.4','debug@4.4.3'),('debug: 4.5.4','debug: 4.4.3'),
            ('sha512-faiGnoIrLH/V8cibOMEAZ8pMw6oXqSukl29ra4mN8GdaB2ZewzeaLj+INpV5N+Z1eKWzY+IzaIZH2EIR6YZRNQ==','sha512-k97ENvZWtvA6yqz5/FS6a7duDgOPEeOQOc2iKS/nY6mX6qJUKtLnWzQS+Xj6tXweyj6ZcTAK2Qecetnvi9nCLA=='),
            ('sha512-fMPwH9v7r/pp43yUd2/Mbiex5KouJwwR3dzHkhLREUC6764VyDsqxhAxv6OFEYR1RhjOyD1naqba8ECDBe7ZQg==','sha512-I8bPpDLcHBv1qiIiXDCy71Rt8eQDKJP0sMSWJphDdAcdqiJ1sGpZamavoEIRZmYzjia9LuEb2HlYdDpmoENpvQ=='),
            ('sha512-B/xn2TPS4f61cEBLFjiYlQFnBZUW1YVj/LM+C+N4OP8Rs95VLEI2ot/RlfBg111la/EiyECFaJJi/A3FWA8MUA==','sha512-9E33ebgMaO33w1nN/jEdW8z3/GO483fMi4rqbMG9rt83XgW9QLKRe4NcmJ8s+fQ3O34++UHrIQwlIWGIWTITjA=='),
            ('sha512-yXCCWxGFYT6bLIPYC4SY6fPQPRs/d797rRIue+J9XP2Td6vQvD53gaQRBCnIVT1kTQRHtAtxlfOQNWAuIF8ELg==','sha512-6lksP35l6KszDKUeRTi4LV7i6DEe0Yzl2ALJm9j4c5xEYN91GdW1xGsawGMOg2mgjF5GHBVX8pKX9kP+cWsP3Q=='),
            ('sha512-XSf8VYWSB6G/0IY3rWVbyLcxWXtAVHkN1PQE2agTaCv3u8RGvbwu56TyyR/MNzBqqNavEBTZzErcxI1TxBrjcA==','sha512-N6gdSoWRDk0Rh/fVtlqUtLs+fEN3ELFZI3cn3IQE9Mnf3E+Mh8wjO6MstzCOPFh4Yf0L1as5m2eUyYWj8ylVSQ=='),
            ('sha512-ytENFjIJFl2UwYglde2jchW2Hwm4GJFLDiSXWdTrJQBIN9Fcyp7n4DhxJEiWNAJMV1/BqWfW/kkg71UDcHJyTQ==','sha512-sC95tT5iHHH9gtpj6A81kh+NEaRAUFN+qlUPDUbRfOMvNf5QCBqsb3WgvnpVtK5Y+4UfA6KqufotuTvMGiTlsA==')]
          for old,new in pairs:
              if old not in text:raise ValueError('derivation transform absent')
              text=text.replace(old,new)
          result=text.encode()
          if hashlib.sha256(result).hexdigest()!='48c4a7d64fefb312958641b94d8aba7c2cace29095033ed8d0f7ac9f4f5de4ba':raise ValueError('not exact generated bytes')
          expected='7d84c7b8a9fa20ec1165600b3cd89989f3559770'
          if hashlib.sha1(b'blob '+str(len(result)).encode()+b'\0'+result).hexdigest()!=expected:raise ValueError('Git identity differs')
          # Journal before exactly one object upload. No retry or reference mutation.
          pathlib.Path('object-intent.json').write_text(json.dumps({'blob_sha':expected,'sha256':hashlib.sha256(result).hexdigest(),'ref_mutations':0,'commit_mutations':0}))
          uploaded=call(base,json.dumps({'content':text,'encoding':'utf-8'}).encode())
          if uploaded.get('sha')!=expected:raise ValueError('upload identity differs')
          readback=call(base+'/'+expected)
          if base64.b64decode(readback['content'])!=result:raise ValueError('readback differs')
          print(json.dumps({'state':'EXACT_BLOB_STORED_AND_READ_BACK','blob_sha':expected,'bytes':len(result),'ref_mutations':0,'commit_mutations':0}))
          pathlib.Path('object-receipt.json').write_text(json.dumps({'blob_sha':expected,'sha256':hashlib.sha256(result).hexdigest(),'bytes':len(result),'run_id':os.environ['GITHUB_RUN_ID'],'source_workflow':os.environ['GITHUB_SHA'],'ref_mutations':0,'commit_mutations':0},indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reviewed-lock-object-${{ github.run_id }}
          path: object-*.json
          if-no-files-found: error
          retention-days: 14
