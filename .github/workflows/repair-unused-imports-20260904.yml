name: Repair exact Immune F401 imports

on:
  push:
    branches:
      - fix/immune-unused-imports-20260904
    paths:
      - .github/workflows/repair-unused-imports-20260904.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out current-main repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/immune-unused-imports-20260904
          fetch-depth: 1

      - name: Remove only the two proved unused imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          repairs = {
              Path('scripts/hf_space_preserve_and_consolidate.py'): 'import re\n',
              Path('scripts/hf_space_delete_from_receipt.py'): 'import time\n',
          }
          for path, needle in repairs.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one {needle!r}; found {count}')
              path.write_text(text.replace(needle, '', 1), encoding='utf-8')
          PY

      - name: Verify the exact blocking lint contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'ruff==0.16.6'
          python -m compileall -q \
            scripts/hf_space_preserve_and_consolidate.py \
            scripts/hf_space_delete_from_receipt.py
          ruff check \
            scripts/hf_space_preserve_and_consolidate.py \
            scripts/hf_space_delete_from_receipt.py \
            --select E9,F

      - name: Commit only the two Python repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stephen P. Lutar Jr."
          git config user.email "stephenlutar2@gmail.com"
          git add \
            scripts/hf_space_preserve_and_consolidate.py \
            scripts/hf_space_delete_from_receipt.py
          git commit -m "fix(ci): remove two unused consolidation imports" -m "Clear the exact Ruff F401 failures for re and time without changing preservation, receipt verification, or deletion behavior."
          git push origin HEAD:fix/immune-unused-imports-20260904
