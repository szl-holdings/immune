# SPDX-License-Identifier: Apache-2.0
name: PR 100 bounded repair

on:
  push:
    branches:
      - fix/remove-unused-re-20260904
    paths:
      - .github/workflows/pr100-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.0.0
        with:
          ref: fix/remove-unused-re-20260904
          fetch-depth: 1

      - name: Apply exact lint and non-root runtime corrections
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("scripts/hf_space_preserve_and_consolidate.py"): "import re\n",
              Path("scripts/hf_space_delete_from_receipt.py"): "import time\n",
          }
          for path, line in replacements.items():
              text = path.read_text(encoding="utf-8")
              count = text.count(line)
              if count != 1:
                  raise SystemExit(f"expected exactly one {line.strip()!r} in {path}, found {count}")
              path.write_text(text.replace(line, "", 1), encoding="utf-8")

          Path("python/Dockerfile").write_text(
              """# IMMUNE Python kernel — Channel B. Same doctrine as src/lib/immune.\n"
              "FROM mirror.gcr.io/library/python:3.12-slim\n\n"
              "ENV PYTHONDONTWRITEBYTECODE=1 \\\n"
              "    PYTHONUNBUFFERED=1 \\\n"
              "    PORT=7860 \\\n"
              "    IMMUNE_DATA_DIR=/app/data/immune\n\n"
              "RUN groupadd --system --gid 10001 immune \\\n"
              "    && useradd --system --uid 10001 --gid immune --create-home \\\n"
              "       --home-dir /home/immune --shell /usr/sbin/nologin immune \\\n"
              "    && install -d -o immune -g immune /app /app/data/immune\n\n"
              "WORKDIR /app\n"
              "COPY python/requirements.txt ./requirements.txt\n"
              "RUN pip install --no-cache-dir -r requirements.txt\n"
              "COPY --chown=immune:immune python/immune ./immune\n"
              "COPY --chown=immune:immune python/space/index.html ./index.html\n"
              "COPY --chown=immune:immune python/space/run.py ./server.py\n\n"
              "USER immune\n"
              "EXPOSE 7860\n"
              "HEALTHCHECK --interval=30s --timeout=5s --start-period=20s --retries=5 \\\n"
              "  CMD python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/readyz', timeout=4)\"\n"
              "CMD [\"python\", \"-u\", \"server.py\"]\n""",
              encoding="utf-8",
          )
          PY

      - name: Commit bounded repair to the feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/Dockerfile \
            scripts/hf_space_preserve_and_consolidate.py \
            scripts/hf_space_delete_from_receipt.py
          git diff --cached --check
          git diff --cached --quiet && { echo "No repair changes produced"; exit 1; }
          git commit -m "fix(ci): close lint and non-root runtime gates"
          git push origin HEAD:fix/remove-unused-re-20260904
