name: CI

# Self-contained quality gate for the IMMUNE demo artifact. The repository
# installs, typechecks, builds its frontend/server bundle, and starts that exact
# bundle before the source-binding and receipt-chain assertions pass.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.1.7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node@v4
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Explicit repository-level Space restart contract
        run: python3 -m unittest tests.test_restart_hf_space -v
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Authority persistence, signature, replay, and tamper tests
        run: pnpm test
      - name: Foundations honesty guard (dependency-free)
        working-directory: frontend
        run: node scripts/check-foundations-corpus.mjs
      - name: Build standalone runtime
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm run build
      - name: Smoke exact built runtime
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/smoke-standalone.mjs
