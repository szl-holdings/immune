name: CI

# Self-contained quality gate for the IMMUNE demo artifact. The repository
# installs, typechecks, builds its frontend/server bundle, and starts that exact
# bundle before the source-binding and receipt-chain assertions pass.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.1.7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node@v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Fail-closed operational and dependency-workspace contracts
        run: python3 -m unittest tests.test_assert_hf_space_operational tests.test_dependency_workspace -v
      - name: Existing-Space publication boundary (offline)
        run: python3 -m unittest discover -s tests -p 'test_immune_publication*.py' -v
      - name: Python kernel (aligned with src/lib/immune)
        run: |
          python3 -m pip install -r python/requirements.txt
          PYTHONPATH=python python3 -m unittest discover -s python/tests -v
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Authority persistence, signature, replay, and tamper tests
        run: pnpm test
      - name: Foundations honesty guard (dependency-free)
        working-directory: frontend
        run: node scripts/check-foundations-corpus.mjs
      - name: Build standalone runtime
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm run build
      - name: Smoke exact built runtime
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/smoke-standalone.mjs
      - name: Verify built frontend asset delivery and missing-asset boundary
        id: static_delivery
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/static-delivery.mjs
      - name: Retain exact built-delivery observation
        if: ${{ always() && steps.static_delivery.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: immune-static-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/static-delivery/observation.json
          if-no-files-found: error
          retention-days: 90
      - name: Set up production publisher Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Qualify pinned SDK against actual built bundles without provider mutation
        id: publisher_sdk
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/immune-publisher-qualification"
          qpython="$RUNNER_TEMP/immune-publisher-qualification/bin/python"
          "$qpython" -m pip install --disable-pip-version-check 'huggingface_hub==1.23.0'
          mkdir -p reports/publication-sdk
          "$qpython" -m pip freeze --all > reports/publication-sdk/environment.txt
          "$qpython" -m unittest discover -s tests -p 'test_immune_publication*.py' -v 2>&1 | tee reports/publication-sdk/tests-normal.log
          "$qpython" -O -m unittest discover -s tests -p 'test_immune_publication*.py' -v 2>&1 | tee reports/publication-sdk/tests-optimized.log
          "$qpython" tests/check_publication_sdk.py
      - name: Retain source-bound publisher qualification
        if: ${{ always() && steps.publisher_sdk.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: immune-publisher-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/publication-sdk/
          if-no-files-found: error
          retention-days: 90
